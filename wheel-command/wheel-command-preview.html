  <title>Wheel Command Preview</title>
  <meta name="description" content="Wheel strategy and options income scanner: ranked cash-secured puts and covered calls, wheel lifecycle tracking and income analytics." />

  <style>:root {
  --bg: #0a0c0f;
  --bg-2: #0e1115;
  --surface: #13171c;
  --surface-2: #191e24;
  --surface-3: #222830;
  --line: rgba(255, 255, 255, 0.07);
  --line-2: rgba(255, 255, 255, 0.12);
  --text: #eceef1;
  --text-2: #a3aab4;
  --text-3: #6c747f;
  --green: #2fd47a;
  --green-bg: rgba(47, 212, 122, 0.12);
  --red: #ff5c63;
  --red-bg: rgba(255, 92, 99, 0.12);
  --amber: #f5b945;
  --amber-bg: rgba(245, 185, 69, 0.12);
  --blue: #5b9bff;
  --blue-bg: rgba(91, 155, 255, 0.12);
  --violet: #a68bff;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: radial-gradient(1200px 600px at 70% -10%, rgba(91, 155, 255, 0.07), transparent 60%), var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font: 15px/1.45 var(--font);
  font-feature-settings: 'cv11', 'ss01', 'tnum';
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue); text-decoration: none; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
.mono { font-family: var(--mono); }
.pos { color: var(--green); }
.neg { color: var(--red); }
.warn { color: var(--amber); }
.muted { color: var(--text-2); }
.dim { color: var(--text-3); }
.hidden { display: none !important; }

/* ---------- chrome ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 16px;
  padding: 12px max(16px, calc((100vw - 1180px) / 2));
  background: rgba(10, 12, 15, 0.78);
  backdrop-filter: saturate(160%) blur(18px);
  -webkit-backdrop-filter: saturate(160%) blur(18px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); font-weight: 500; letter-spacing: -0.01em; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; }
.brand b { font-weight: 800; margin-left: 2px; }
.nav { display: none; gap: 4px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); padding: 4px; border-radius: 999px; }
.nav a { color: var(--text-2); padding: 7px 16px; border-radius: 999px; font-weight: 500; font-size: 14px; transition: background .2s, color .2s; }
.nav a:hover { color: var(--text); }
.nav a.active { background: var(--surface-3); color: var(--text); }
.status { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--text-2); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); display: inline-block; }
.dot.ok { background: var(--green); box-shadow: 0 0 10px var(--green); }
.dot.bad { background: var(--red); }
.dot.warn { background: var(--amber); }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px 6px calc(6px + var(--safe-b));
  background: rgba(14, 17, 21, 0.86);
  backdrop-filter: saturate(160%) blur(18px);
  -webkit-backdrop-filter: saturate(160%) blur(18px);
  border-top: 1px solid var(--line);
}
.tabbar a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: var(--text-3); font-size: 10.5px; font-weight: 600; letter-spacing: .01em; border-radius: 12px; }
.tabbar a svg { width: 22px; height: 22px; }
.tabbar a.active { color: var(--text); }
.tabbar a.active svg { color: var(--green); }

main { max-width: 1180px; margin: 0 auto; padding: 20px 16px calc(96px + var(--safe-b)); outline: none; }
@media (min-width: 900px) {
  .nav { display: flex; }
  .tabbar { display: none; }
  main { padding: 32px 24px 64px; }
  .status { margin-left: 0; }
}

/* ---------- typography ---------- */
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
h1.title { font-size: clamp(28px, 6vw, 44px); font-weight: 800; letter-spacing: -0.035em; line-height: 1.05; margin: 6px 0 4px; }
h2.section { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); font-weight: 600; margin: 28px 0 12px; display: flex; align-items: center; gap: 10px; }
h2.section .count { background: var(--surface-2); color: var(--text-2); padding: 1px 8px; border-radius: 999px; font-size: 11px; }
.lede { color: var(--text-2); margin: 0 0 22px; font-size: 15px; }
.big { font-size: clamp(26px, 5vw, 34px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
.huge { font-size: clamp(34px, 8vw, 52px); font-weight: 800; letter-spacing: -0.04em; line-height: 1; }

/* ---------- surfaces ---------- */
.card { background: linear-gradient(180deg, var(--surface), var(--bg-2)); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.card + .card { margin-top: 12px; }
.grid { display: grid; gap: 12px; }
.grid.two { grid-template-columns: 1fr; }
.grid.kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 720px) {
  .grid.two { grid-template-columns: 1fr 1fr; }
  .grid.kpi { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
.kpi-tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.kpi-tile .label { font-size: 12px; color: var(--text-3); font-weight: 600; letter-spacing: .02em; }
.kpi-tile .value { font-size: clamp(22px, 4.6vw, 30px); font-weight: 700; letter-spacing: -0.03em; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-tile .sub { font-size: 12px; color: var(--text-2); margin-top: 2px; }

/* ---------- controls ---------- */
.field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.field > label, .field > .label { font-size: 12px; font-weight: 600; color: var(--text-2); letter-spacing: .01em; display: flex; justify-content: space-between; }
.input { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; outline: none; width: 100%; transition: border-color .15s, background .15s; min-width: 0; }
.input:focus { border-color: var(--blue); background: var(--surface-3); }
.input-wrap { position: relative; display: flex; align-items: center; }
.input-wrap .prefix, .input-wrap .suffix { position: absolute; color: var(--text-3); font-size: 14px; pointer-events: none; }
.input-wrap .prefix { left: 14px; }
.input-wrap .suffix { right: 14px; }
.input-wrap .prefix + .input { padding-left: 28px; }
.input-wrap .input:has(+ .suffix) { padding-right: 40px; }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%); background-position: calc(100% - 18px) 52%, calc(100% - 13px) 52%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.range { width: 100%; accent-color: var(--green); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; color: var(--text-2); padding: 10px 8px; border-radius: 10px; font-weight: 600; font-size: 13.5px; transition: background .2s, color .2s; white-space: nowrap; }
.seg button.on { background: var(--surface-3); color: var(--text); box-shadow: 0 1px 0 rgba(255, 255, 255, .05) inset, 0 4px 12px rgba(0, 0, 0, .3); }
.seg button:disabled { opacity: .35; cursor: not-allowed; }
.seg.small button { padding: 7px 6px; font-size: 12.5px; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 720px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 16px; transition: border-color .2s, transform .15s, background .2s; }
.tile:hover { border-color: var(--line-2); }
.tile:active { transform: scale(.985); }
.tile .t-name { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
.tile .t-sub { font-size: 12px; color: var(--text-3); margin-top: 4px; }
.tile.on { border-color: rgba(47, 212, 122, .55); background: linear-gradient(180deg, rgba(47, 212, 122, .08), var(--surface)); }
.tile.on .t-name::after { content: ''; display: inline-block; width: 7px; height: 7px; background: var(--green); border-radius: 50%; margin-left: 8px; vertical-align: middle; box-shadow: 0 0 8px var(--green); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--text); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; transition: background .15s, transform .1s, border-color .15s; white-space: nowrap; }
.btn:hover { background: var(--surface-3); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--green); color: #04150b; border-color: transparent; }
.btn.primary:hover { background: #45e08b; }
.btn.danger { color: var(--red); border-color: rgba(255, 92, 99, .35); background: var(--red-bg); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { color: var(--text); background: var(--surface-2); }
.btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn svg { width: 16px; height: 16px; }

.scan-btn { width: 100%; padding: 18px; font-size: 17px; border-radius: 16px; letter-spacing: -0.01em; box-shadow: 0 10px 30px rgba(47, 212, 122, .22); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--text-2); padding: 7px 13px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; letter-spacing: .01em; }
.pill.strong { background: var(--green-bg); color: var(--green); }
.pill.favorable { background: rgba(91, 155, 255, .13); color: var(--blue); }
.pill.watch { background: var(--amber-bg); color: var(--amber); }
.pill.avoid { background: var(--red-bg); color: var(--red); }
.pill.unverified { background: var(--surface-3); color: var(--text-2); }
.pill.tag { background: var(--surface-3); color: var(--text-2); font-weight: 600; }

.form-grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 720px) { .form-grid { grid-template-columns: 1fr 1fr; } .form-grid .full { grid-column: 1 / -1; } }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.spacer { flex: 1; }

details.adv { border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
details.adv > summary { list-style: none; padding: 14px 16px; cursor: pointer; display: flex; justify-content: space-between; color: var(--text-2); font-weight: 600; font-size: 14px; }
details.adv > summary::-webkit-details-marker { display: none; }
details.adv > summary::after { content: '+'; color: var(--text-3); font-weight: 400; font-size: 18px; line-height: 1; }
details.adv[open] > summary::after { content: '–'; }
details.adv > .body { padding: 0 16px 16px; }

/* ---------- scanner ---------- */
.regime { display: flex; align-items: center; gap: 14px; }
.regime .spark { flex: 1; min-width: 60px; height: 42px; }
.progress { height: 6px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--green), #8ef0b8); border-radius: 99px; transition: width .25s ease; }
.scan-live { display: grid; gap: 12px; }
.ticker-flow { display: flex; flex-wrap: wrap; gap: 6px; max-height: 92px; overflow: hidden; }
.ticker-flow span { font: 600 11px var(--mono); padding: 3px 7px; border-radius: 6px; background: var(--surface-2); color: var(--text-3); }
.ticker-flow span.ok { color: var(--green); background: var(--green-bg); }
.ticker-flow span.bad { color: var(--text-2); }

/* ---------- opportunity cards ---------- */
.opp { background: linear-gradient(180deg, var(--surface), var(--bg-2)); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; transition: border-color .2s; }
.opp + .opp { margin-top: 10px; }
.opp.open { border-color: var(--line-2); }
.opp-head { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 14px 16px; width: 100%; background: none; border: 0; text-align: left; }
.rank { font: 600 12px var(--mono); color: var(--text-3); width: 22px; text-align: center; }
.sym { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.sym .px { font-size: 15px; font-weight: 600; color: var(--text); }
.sym .chg { font-size: 12.5px; font-weight: 600; }
.opp-name { color: var(--text-3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opp-line { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; font-size: 12.5px; color: var(--text-2); align-items: center; }
.opp-line b { color: var(--text); font-weight: 600; }
.score-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.ring { width: 52px; height: 52px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 16px; letter-spacing: -0.03em; }
.opp-body { border-top: 1px solid var(--line); padding: 16px; display: grid; gap: 16px; animation: reveal .25s ease; }
@keyframes reveal { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.contract-hero { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
.contract-hero .what { font-size: 14px; color: var(--text-2); font-weight: 500; }
.contract-hero .what b { color: var(--text); }
.metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--line); }
@media (min-width: 560px) { .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 900px) { .metrics { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.metric { background: var(--surface); padding: 11px 12px; min-width: 0; }
.metric .k { font-size: 11px; color: var(--text-3); font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
.metric .v { font-size: 15px; font-weight: 650; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bars { display: grid; gap: 9px; }
.bar-row { display: grid; grid-template-columns: 108px 1fr 40px; gap: 10px; align-items: center; font-size: 12.5px; }
.bar-row .lbl { color: var(--text-2); white-space: nowrap; }
.bar-row .lbl small { color: var(--text-3); }
.bar { height: 7px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; }
.bar-row .val { text-align: right; font-weight: 700; }
.reasons { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; font-size: 13.5px; }
.reasons li { display: flex; gap: 9px; align-items: flex-start; }
.reasons li::before { flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; margin-top: 1px; }
.reasons li.good::before { content: '✓'; background: var(--green-bg); color: var(--green); }
.reasons li.bad::before { content: '!'; background: var(--amber-bg); color: var(--amber); }
.panel { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px; }
.panel h4 { margin: 0 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); font-weight: 600; }
.range52 { position: relative; height: 6px; border-radius: 99px; background: linear-gradient(90deg, var(--red), var(--amber), var(--green)); opacity: .9; margin: 8px 0 4px; }
.range52 i { position: absolute; top: -4px; width: 3px; height: 14px; background: var(--text); border-radius: 2px; transform: translateX(-50%); box-shadow: 0 0 0 3px var(--bg-2); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; font-size: 13px; }
.kv dt { color: var(--text-2); }
.kv dd { margin: 0; text-align: right; font-weight: 600; }
.note { font-size: 11.5px; color: var(--text-3); line-height: 1.5; }
.meter { height: 8px; border-radius: 99px; background: var(--surface-3); position: relative; overflow: hidden; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; }

.mini-list { display: grid; gap: 1px; background: var(--line); border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--line); }
.mini-list > div { background: var(--surface); padding: 11px 14px; display: flex; gap: 12px; align-items: center; font-size: 13.5px; }
.mini-list .s { font-weight: 700; min-width: 58px; }

/* ---------- wheel ---------- */
.cycle { background: linear-gradient(180deg, var(--surface), var(--bg-2)); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.cycle + .cycle { margin-top: 12px; }
.stepper { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 14px 0; }
.stepper div { text-align: center; font-size: 10.5px; color: var(--text-3); font-weight: 600; }
.stepper div::before { content: ''; display: block; height: 4px; border-radius: 99px; background: var(--surface-3); margin-bottom: 6px; }
.stepper div.done::before { background: rgba(47, 212, 122, .45); }
.stepper div.now { color: var(--text); }
.stepper div.now::before { background: var(--green); box-shadow: 0 0 10px rgba(47, 212, 122, .6); }
.pos-row { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bg-2); }
.pos-row + .pos-row { margin-top: 8px; }
.pos-row .actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- income ---------- */
.chart { width: 100%; height: auto; display: block; margin-top: 8px; }
.chart text { fill: var(--text-3); font-size: 10px; font-family: var(--font); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
th { text-align: left; font-weight: 600; color: var(--text-3); font-size: 11.5px; letter-spacing: .03em; padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }

/* ---------- sheet / modal ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); z-index: 50; animation: fade .2s ease; backdrop-filter: blur(3px); }
@keyframes fade { from { opacity: 0; } }
.sheet { position: fixed; z-index: 51; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line-2); border-radius: 22px 22px 0 0; padding: 8px 18px calc(20px + var(--safe-b)); box-shadow: var(--shadow); animation: up .28s cubic-bezier(.2, .9, .3, 1); }
.sheet .grab { width: 38px; height: 5px; border-radius: 99px; background: var(--surface-3); margin: 4px auto 12px; }
.sheet h3 { margin: 0 0 4px; font-size: 20px; letter-spacing: -0.02em; }
.sheet .sub { color: var(--text-2); font-size: 13.5px; margin-bottom: 18px; }
.sheet .foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@media (min-width: 720px) {
  .sheet { left: 50%; right: auto; bottom: auto; top: 50%; transform: translate(-50%, -50%); width: min(620px, calc(100vw - 32px)); border-radius: 22px; padding: 22px 24px; animation: pop .22s ease; }
  .sheet .grab { display: none; }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, -48%) scale(.98); } }
}
#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + var(--safe-b)); z-index: 60; display: grid; gap: 8px; width: min(420px, calc(100vw - 32px)); }
@media (min-width: 900px) { #toasts { bottom: 28px; } }
.toast { background: var(--surface-3); border: 1px solid var(--line-2); padding: 12px 16px; border-radius: 14px; font-size: 14px; box-shadow: var(--shadow); animation: up .25s ease; display: flex; gap: 10px; align-items: center; }
.toast.err { border-color: rgba(255, 92, 99, .4); }

.empty { text-align: center; padding: 54px 20px; color: var(--text-2); }
.empty .icon { width: 56px; height: 56px; margin: 0 auto 14px; color: var(--text-3); }
.empty h3 { color: var(--text); margin: 0 0 6px; font-size: 18px; }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--radius-sm); background: var(--amber-bg); border: 1px solid rgba(245, 185, 69, .25); color: #f7d18c; font-size: 13.5px; margin-bottom: 16px; }
.banner.err { background: var(--red-bg); border-color: rgba(255, 92, 99, .3); color: #ffb0b3; }
.banner b { color: var(--text); }
.skeleton { background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.3s infinite; border-radius: 8px; }
@keyframes shimmer { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- containment fixes ---------- */
svg.spark { display: block; width: 100%; height: 100%; }
.regime > div.spark { overflow: hidden; min-width: 0; }
.opp-body > *, .opp-head > * { min-width: 0; }
.seg.small button { white-space: normal; line-height: 1.25; min-width: 0; }
.seg.small button .dim { display: block; font-size: 11px; margin-top: 1px; }
@media (max-width: 480px) {
  .regime { flex-wrap: wrap; }
  .regime > div.spark { order: 3; flex-basis: 100%; }
  .bar-row { grid-template-columns: 92px 1fr 34px; }
}
</style>
