name: Build APK Builder 4 Native Capabilities
on:
  push:
    branches: [feature/apk-builder-4-native-capabilities]
    paths:
      - "overlay/apk-builder.patch"
      - "overlay/apk-builder-4-tests.patch"
      - "overlay/apk-builder-4-native.patch"
      - ".github/workflows/build-apk-builder.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: overlay-repo
      - name: Clone pinned conversion engine
        run: git clone https://github.com/shiaho777/web-to-app.git source && git -C source checkout 8870ee293dbb89f5293c49c3f25e767f3a996e1c
      - name: Apply APK Builder 3 wizard base
        run: git -C source apply --check ../overlay-repo/overlay/apk-builder.patch && git -C source apply ../overlay-repo/overlay/apk-builder.patch
      - name: Apply APK Builder 4 tests
        run: git -C source apply --check ../overlay-repo/overlay/apk-builder-4-tests.patch && git -C source apply ../overlay-repo/overlay/apk-builder-4-tests.patch
      - name: Apply APK Builder 4 native capabilities
        run: git -C source apply --check ../overlay-repo/overlay/apk-builder-4-native.patch && git -C source apply ../overlay-repo/overlay/apk-builder-4-native.patch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build tools
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
      - name: Test wizard, native presets, and converter
        working-directory: source
        run: ./gradlew --no-daemon --no-configuration-cache -Dkotlin.compiler.execution.strategy=in-process -PskipShellTemplateSync=true -PallowDebugSignedRelease=true :app:testStandardDebugUnitTest :app:checkConfigFieldDrift
      - name: Build installable candidate APK
        working-directory: source
        run: ./gradlew --no-daemon --no-configuration-cache -Dkotlin.compiler.execution.strategy=in-process -PallowDebugSignedRelease=true :app:assembleStandardDebug
      - name: Verify APK and embedded shell
        run: |
          APK=$(find source/app/build/outputs/apk -name "*.apk" -type f | head -1)
          test -s "$APK"
          TEMPLATE_ENTRY="assets/template/webview_shell.apk"
          unzip -Z1 "$APK" | grep -Fx "$TEMPLATE_ENTRY"
          unzip -p "$APK" "$TEMPLATE_ENTRY" > embedded-webview-shell.apk
          test -s embedded-webview-shell.apk
          unzip -tqq embedded-webview-shell.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" APK-Builder-4.0-candidate.apk
          sha256sum APK-Builder-4.0-candidate.apk > APK-Builder-4.0-candidate.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: APK-Builder-4.0-candidate
          path: |
            APK-Builder-4.0-candidate.apk
            APK-Builder-4.0-candidate.apk.sha256
          if-no-files-found: error
