name: Build APK Builder 3.0
on:
  push:
    branches: [main]
    paths:
      - "overlay/apk-builder.patch"
      - ".github/workflows/build-apk-builder.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: overlay-repo
      - name: Clone pinned conversion engine
        run: git clone https://github.com/shiaho777/web-to-app.git source && git -C source checkout 8870ee293dbb89f5293c49c3f25e767f3a996e1c
      - name: Apply APK Builder wizard
        run: git -C source apply --check ../overlay-repo/overlay/apk-builder.patch && git -C source apply ../overlay-repo/overlay/apk-builder.patch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build tools
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
      - name: Test wizard and converter
        working-directory: source
        run: ./gradlew --no-daemon --no-configuration-cache -Dkotlin.compiler.execution.strategy=in-process -PskipShellTemplateSync=true -PallowDebugSignedRelease=true :app:testStandardDebugUnitTest :app:checkConfigFieldDrift
      - name: Build installable test APK
        working-directory: source
        run: ./gradlew --no-daemon --no-configuration-cache -Dkotlin.compiler.execution.strategy=in-process -PallowDebugSignedRelease=true :app:assembleStandardDebug
      - name: Verify APK
        run: |
          APK=$(find source/app/build/outputs/apk/standard/debug -name "*.apk" -type f | head -1)
          test -s "$APK"
          apksigner verify --verbose --print-certs "$APK"
          cp "$APK" APK-Builder.apk
          sha256sum APK-Builder.apk > APK-Builder.apk.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: APK Builder 3.0
          body: "Guided APK Builder: HTML file, ZIP project, or website. No paid API key required. Uninstall an older build first because this edition has its own package identity."
          files: |
            APK-Builder.apk
            APK-Builder.apk.sha256
          fail_on_unmatched_files: true
          make_latest: true
