name: Build APK Builder 4.0.1
on:
  push:
    branches: [recovery/apk-builder-4.0-verified]
    paths:
      - "overlay/apk-builder.patch"
      - "scripts/apply-native-features.py"
      - "scripts/fix-generated-app-gestures-and-name.py"
      - ".github/workflows/build-apk-builder.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: overlay-repo
      - name: Clone pinned conversion engine
        run: git clone https://github.com/shiaho777/web-to-app.git source && git -C source checkout 8870ee293dbb89f5293c49c3f25e767f3a996e1c
      - name: Apply APK Builder wizard
        run: git -C source apply --check ../overlay-repo/overlay/apk-builder.patch && git -C source apply ../overlay-repo/overlay/apk-builder.patch
      - name: Apply APK Builder 4 native features
        run: cp overlay-repo/scripts/apply-native-features.py source/scripts/apply-native-features.py && python3 source/scripts/apply-native-features.py
      - name: Fix generated app gestures and launcher name
        run: cp overlay-repo/scripts/fix-generated-app-gestures-and-name.py source/scripts/fix-generated-app-gestures-and-name.py && python3 source/scripts/fix-generated-app-gestures-and-name.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build tools
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
      - name: Test wizard, native features, and converter
        working-directory: source
        run: ./gradlew --no-daemon --no-configuration-cache -Dkotlin.compiler.execution.strategy=in-process -PskipShellTemplateSync=true -PallowDebugSignedRelease=true :app:testStandardDebugUnitTest :app:checkConfigFieldDrift
      - name: Build installable test APK
        working-directory: source
        run: ./gradlew --no-daemon --no-configuration-cache -Dkotlin.compiler.execution.strategy=in-process -PallowDebugSignedRelease=true :app:assembleStandardDebug
      - name: Verify APK
        run: |
          APK=$(find source/app/build/outputs/apk -name "*.apk" -type f | head -1)
          test -s "$APK"
          TEMPLATE_ENTRY="assets/template/webview_shell.apk"
          unzip -Z1 "$APK" | grep -Fx "$TEMPLATE_ENTRY"
          unzip -p "$APK" "$TEMPLATE_ENTRY" > embedded-webview-shell.apk
          test -s embedded-webview-shell.apk
          unzip -tqq embedded-webview-shell.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" APK-Builder.apk
          sha256sum APK-Builder.apk > APK-Builder.apk.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.1
          name: APK Builder 4.0.1
          body: "Applies the generated app's selected name to the Android launcher label and preserves horizontal gestures while allowing vertical pull-to-refresh."
          files: |
            APK-Builder.apk
            APK-Builder.apk.sha256
          fail_on_unmatched_files: true
          make_latest: true
