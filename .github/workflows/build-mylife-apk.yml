name: Build My Life Test APK

on:
  push:
    branches:
      - my-life-apk-build
    paths:
      - "my-life-apk/**"
      - ".github/workflows/build-mylife-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Restore and verify My Life HTML
        run: |
          set -euo pipefail
          mkdir -p my-life-apk/assets build/classes build/dex build/compiled-res build/gen
          cat my-life-apk/html-b64/part_*.txt | base64 --decode > build/index.html.bz2
          bzip2 -dc build/index.html.bz2 > my-life-apk/assets/index.html
          test -s my-life-apk/assets/index.html
          grep -q '<title>My Life</title>' my-life-apk/assets/index.html
          echo "578dc626ca6ad1daea202d9402d37f6d559a2305dba9789ff8aa118a7260e2e3  my-life-apk/assets/index.html" | sha256sum --check

      - name: Test reminder date engine
        run: |
          mkdir -p build/test-classes
          javac -d build/test-classes \
            my-life-apk/src/com/osulsa/mylife/ReminderTimeCalculator.java \
            my-life-apk/tests/ReminderTimeCalculatorTest.java
          java -cp build/test-classes com.osulsa.mylife.ReminderTimeCalculatorTest

      - name: Compile and link Android resources
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt2" compile --dir my-life-apk/res -o build/resources.zip
          unzip -q build/resources.zip -d build/compiled-res
          mapfile -d '' RES_FILES < <(find build/compiled-res -type f -name '*.flat' -print0)
          RES_ARGS=()
          for f in "${RES_FILES[@]}"; do RES_ARGS+=( -R "$f" ); done
          "$BT/aapt2" link \
            -I "$ANDROID_JAR" \
            --manifest my-life-apk/AndroidManifest.xml \
            --min-sdk-version 26 \
            --target-sdk-version 36 \
            --java build/gen \
            "${RES_ARGS[@]}" \
            -A my-life-apk/assets \
            -o build/My-Life-unsigned.apk

      - name: Compile native Android bridge
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          find my-life-apk/src build/gen -name '*.java' -print0 | \
            xargs -0 javac -source 8 -target 8 -classpath "$ANDROID_JAR" -d build/classes
          jar cf build/classes.jar -C build/classes .

      - name: Add DEX and sign APK
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --output build/dex build/classes.jar
          zip -j build/My-Life-unsigned.apk build/dex/classes.dex
          "$BT/zipalign" -f -p 4 build/My-Life-unsigned.apk build/My-Life-aligned.apk
          keytool -genkeypair -v \
            -keystore build/test-key.jks \
            -storepass android -keypass android \
            -alias mylife-test \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=My Life Test,O=OSULSA,C=US"
          "$BT/apksigner" sign \
            --ks build/test-key.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build/My-Life-Test.apk \
            build/My-Life-aligned.apk

      - name: Verify APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          test -s build/My-Life-Test.apk
          unzip -tqq build/My-Life-Test.apk
          unzip -l build/My-Life-Test.apk | grep -q "assets/index.html"
          unzip -l build/My-Life-Test.apk | grep -q "classes.dex"
          "$BT/apksigner" verify --verbose --print-certs build/My-Life-Test.apk
          sha256sum build/My-Life-Test.apk

      - name: Upload My Life APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Life-Test-APK
          path: build/My-Life-Test.apk
          if-no-files-found: error
