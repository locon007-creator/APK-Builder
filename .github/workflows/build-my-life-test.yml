name: Build My Life Test APK

on:
  push:
    branches:
      - my-life-apk-test
    paths:
      - "my-life-apk/**"
      - ".github/workflows/build-my-life-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Restore and verify approved My Life HTML
        run: |
          mkdir -p my-life-apk/assets build/classes build/dex build/compiled-res
          cat my-life-apk/html-b64/part_*.txt | base64 --decode > build/index.html.bz2
          bzip2 -dc build/index.html.bz2 > my-life-apk/assets/index.html
          test -s my-life-apk/assets/index.html
          grep -q '<title>My Life</title>' my-life-apk/assets/index.html
          echo "d67eac5ba7bbcca81efd49896105d74924be2f0eba21adefeb372da3db42ee3e  my-life-apk/assets/index.html" | sha256sum --check

      - name: Compile launcher resource
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt2" compile --dir my-life-apk/res -o build/resources.zip
          unzip -q build/resources.zip -d build/compiled-res

      - name: Compile Android shell
        run: |
          ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          javac -source 8 -target 8 -classpath "$ANDROID_JAR" \
            -d build/classes my-life-apk/src/com/osulsa/mylife/MainActivity.java
          jar cf build/classes.jar -C build/classes .

      - name: Package My Life APK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mapfile -d '' RES_FILES < <(find build/compiled-res -type f -name '*.flat' -print0)
          RES_ARGS=()
          for f in "${RES_FILES[@]}"; do RES_ARGS+=( -R "$f" ); done

          "$BT/aapt2" link \
            -I "$ANDROID_JAR" \
            --manifest my-life-apk/AndroidManifest.xml \
            --min-sdk-version 26 \
            --target-sdk-version 36 \
            "${RES_ARGS[@]}" \
            -A my-life-apk/assets \
            -o build/My-Life-unsigned.apk

          "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --output build/dex build/classes.jar
          zip -j build/My-Life-unsigned.apk build/dex/classes.dex
          "$BT/zipalign" -f -p 4 build/My-Life-unsigned.apk build/My-Life-aligned.apk

          keytool -genkeypair -v \
            -keystore build/test-key.jks \
            -storepass android -keypass android \
            -alias mylife-test \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=My Life Test,O=OSULSA,C=US"

          "$BT/apksigner" sign \
            --ks build/test-key.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build/My-Life.apk \
            build/My-Life-aligned.apk

      - name: Verify test APK
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          test -s build/My-Life.apk
          unzip -tqq build/My-Life.apk
          unzip -l build/My-Life.apk | grep -q "assets/index.html"
          unzip -l build/My-Life.apk | grep -q "classes.dex"
          "$BT/apksigner" verify --verbose --print-certs build/My-Life.apk
          sha256sum build/My-Life.apk

      - name: Upload My Life APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Life-APK
          path: build/My-Life.apk
          if-no-files-found: error
