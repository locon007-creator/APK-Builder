name: Build My Life APK One Shot

on:
  push:
    branches:
      - my-life-final-one-shot
    paths:
      - ".build-once"

permissions:
  contents: write

concurrency:
  group: my-life-one-shot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build, verify, and record result without retry loops
        shell: bash
        run: |
          set +e
          rm -rf build output
          mkdir -p build output my-life-apk/assets build/classes build/dex build/compiled-res build/gen build/test-classes
          LOG="$GITHUB_WORKSPACE/output/build.log"
          : > "$LOG"

          run_logged() {
            echo ">>> $*" >> "$LOG"
            "$@" >> "$LOG" 2>&1
            return $?
          }

          RC=0
          run_logged sdkmanager --install "platforms;android-36" "build-tools;36.0.0" || RC=$?

          if [ "$RC" -eq 0 ]; then
            echo ">>> restore HTML" >> "$LOG"
            cat my-life-apk/html-b64/part_*.txt | base64 --decode > build/index.html.bz2 2>>"$LOG" || RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            bzip2 -dc build/index.html.bz2 > my-life-apk/assets/index.html 2>>"$LOG" || RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            test -s my-life-apk/assets/index.html || RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            grep -q '<title>My Life</title>' my-life-apk/assets/index.html || RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            echo "578dc626ca6ad1daea202d9402d37f6d559a2305dba9789ff8aa118a7260e2e3  my-life-apk/assets/index.html" | sha256sum --check >> "$LOG" 2>&1 || RC=$?
          fi

          if [ "$RC" -eq 0 ]; then
            echo ">>> reminder tests" >> "$LOG"
            javac -d build/test-classes \
              my-life-apk/src/com/osulsa/mylife/ReminderTimeCalculator.java \
              my-life-apk/tests/ReminderTimeCalculatorTest.java >> "$LOG" 2>&1 || RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            java -cp build/test-classes com.osulsa.mylife.ReminderTimeCalculatorTest >> "$LOG" 2>&1 || RC=$?
          fi

          ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          BT="$ANDROID_HOME/build-tools/36.0.0"

          if [ "$RC" -eq 0 ]; then
            echo ">>> resources" >> "$LOG"
            "$BT/aapt2" compile --dir my-life-apk/res -o build/resources.zip >> "$LOG" 2>&1 || RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            unzip -q build/resources.zip -d build/compiled-res >> "$LOG" 2>&1 || RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            mapfile -d '' RES_FILES < <(find build/compiled-res -type f -name '*.flat' -print0)
            RES_ARGS=()
            for f in "${RES_FILES[@]}"; do RES_ARGS+=( -R "$f" ); done
            "$BT/aapt2" link \
              -I "$ANDROID_JAR" \
              --manifest my-life-apk/AndroidManifest.xml \
              --min-sdk-version 26 \
              --target-sdk-version 36 \
              --java build/gen \
              "${RES_ARGS[@]}" \
              -A my-life-apk/assets \
              -o build/My-Life-unsigned.apk >> "$LOG" 2>&1 || RC=$?
          fi

          if [ "$RC" -eq 0 ]; then
            echo ">>> Java native bridge" >> "$LOG"
            find my-life-apk/src build/gen -name '*.java' -print0 | \
              xargs -0 javac -source 8 -target 8 -classpath "$ANDROID_JAR" -d build/classes >> "$LOG" 2>&1 || RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            jar cf build/classes.jar -C build/classes . >> "$LOG" 2>&1 || RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            echo ">>> DEX" >> "$LOG"
            "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --output build/dex build/classes.jar >> "$LOG" 2>&1 || RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            zip -j build/My-Life-unsigned.apk build/dex/classes.dex >> "$LOG" 2>&1 || RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            "$BT/zipalign" -f -p 4 build/My-Life-unsigned.apk build/My-Life-aligned.apk >> "$LOG" 2>&1 || RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            echo ">>> signing" >> "$LOG"
            keytool -genkeypair -noprompt \
              -keystore build/test-key.jks \
              -storepass android -keypass android \
              -alias mylife-test \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=My Life Test,O=OSULSA,C=US" >> "$LOG" 2>&1 || RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            "$BT/apksigner" sign \
              --ks build/test-key.jks \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out build/My-Life.apk \
              build/My-Life-aligned.apk >> "$LOG" 2>&1 || RC=$?
          fi

          if [ "$RC" -eq 0 ]; then
            echo ">>> verification" >> "$LOG"
            test -s build/My-Life.apk || RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            unzip -tqq build/My-Life.apk >> "$LOG" 2>&1 || RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            unzip -l build/My-Life.apk | grep -q "assets/index.html" || RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            unzip -l build/My-Life.apk | grep -q "classes.dex" || RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            "$BT/apksigner" verify --verbose --print-certs build/My-Life.apk >> "$LOG" 2>&1 || RC=$?
          fi
          if [ "$RC" -eq 0 ]; then
            "$BT/aapt2" dump badging build/My-Life.apk >> "$LOG" 2>&1 || RC=$?
          fi

          if [ "$RC" -eq 0 ]; then
            cp build/My-Life.apk output/My-Life.apk
            sha256sum output/My-Life.apk | tee output/My-Life.apk.sha256 >> "$LOG"
            {
              echo "status=SUCCESS"
              echo "artifact=output/My-Life.apk"
              echo "html_sha256=578dc626ca6ad1daea202d9402d37f6d559a2305dba9789ff8aa118a7260e2e3"
              cat output/My-Life.apk.sha256
            } > output/BUILD_RESULT.txt
          else
            {
              echo "status=FAILED"
              echo "exit_code=$RC"
              echo "No automatic retry was performed."
              echo
              echo "Last build log lines:"
              tail -120 "$LOG"
            } > output/BUILD_RESULT.txt
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add output
          git commit -m "Record My Life APK one-shot build result" || true
          git push origin HEAD:my-life-final-one-shot

          # Intentionally report the workflow itself as successful. Actual build status is
          # recorded in output/BUILD_RESULT.txt so compile failures do not create email loops.
          exit 0
