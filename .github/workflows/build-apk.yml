name: Build and Release APK

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "app/**"
      - "scripts/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-builder-release
  cancel-in-progress: true

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out APK Builder
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Validate HTML input
        run: |
          test -s website/index.html
          grep -qi "<html" website/index.html
          grep -qi "</html>" website/index.html

      - name: Package HTML assets
        run: bash scripts/prepare-site.sh

      - name: Build signed Android APK
        run: gradle --no-daemon assembleRelease

      - name: Verify generated APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep "assets/www/index.html"
          cp "$APK" APK-Builder.apk
          sha256sum APK-Builder.apk

      - name: Publish permanent direct download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-builder-latest
          name: APK Builder — Latest
          prerelease: false
          make_latest: true
          files: APK-Builder.apk
          body: |
            Tested Android APK generated from the current HTML project.

            Tap APK-Builder.apk below to download it directly on Android.
