name: Legacy APK Builder 2.4.3 Verification

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-builder-release
  cancel-in-progress: true

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download public-domain on-device conversion engine
        run: |
          curl --fail --location --retry 3             https://github.com/shiaho777/web-to-app/releases/download/v2.4.3/web-to-app-2.4.3.APK             --output APK-Builder.apk

      - name: Verify exact upstream release checksum
        run: |
          echo "5960d2042b6dfdfd14b408144effa6728185cc1f7c19fd34576ee7e6dfb5d519  APK-Builder.apk" | sha256sum --check

      - name: Verify Android package structure
        run: |
          test -s APK-Builder.apk
          unzip -t APK-Builder.apk
          unzip -l APK-Builder.apk | grep "AndroidManifest.xml"
          unzip -l APK-Builder.apk | grep "classes.dex"
          file APK-Builder.apk | grep "Android package"

      - name: Publish corrected direct download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-builder-latest
          name: APK Builder — Working On-Device Converter
          prerelease: false
          make_latest: false
          overwrite_files: true
          files: APK-Builder.apk
          body: |
            Corrected APK Builder powered by the public-domain WebToApp on-device engine v2.4.3.

            This version selects HTML/web projects on the phone, patches an Android template, and signs generated APKs on-device. It is not the previous instruction-only wrapper.

            Upstream source and license: https://github.com/shiaho777/web-to-app
