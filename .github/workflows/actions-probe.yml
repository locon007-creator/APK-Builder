name: Actions Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/actions-probe.yml"

permissions:
  contents: read

# Verification-only workflow used to confirm that GitHub Actions is executing in this repository.
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm GitHub Actions execution
        run: echo "github_actions_probe=passed"
