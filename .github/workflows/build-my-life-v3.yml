name: Build My Life APK V3

on:
  push:
    branches: [my-life-final-one-shot]
    paths: [".build-v3"]

permissions:
  contents: write

concurrency:
  group: my-life-v3
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3

      - name: Build My Life APK
        id: apkbuild
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build output-v3 my-life-apk/assets
          mkdir -p build/{classes,dex,compiled-res,gen,test-classes} output-v3 my-life-apk/assets
          exec > >(tee output-v3/build.log) 2>&1

          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          BT="$ANDROID_HOME/build-tools/36.0.0"

          cat my-life-apk/html-b64/part_*.txt | base64 --decode > build/index.html.bz2
          bzip2 -dc build/index.html.bz2 > my-life-apk/assets/index.html
          test -s my-life-apk/assets/index.html
          grep -q '<title>My Life</title>' my-life-apk/assets/index.html
          echo "578dc626ca6ad1daea202d9402d37f6d559a2305dba9789ff8aa118a7260e2e3  my-life-apk/assets/index.html" | sha256sum --check

          javac -d build/test-classes \
            my-life-apk/src/com/osulsa/mylife/ReminderTimeCalculator.java \
            my-life-apk/tests/ReminderTimeCalculatorTest.java
          java -cp build/test-classes com.osulsa.mylife.ReminderTimeCalculatorTest

          # JSONObject.put throws checked JSONException in the real Android API.
          # These helpers are already invoked inside syncState's try/catch, so declare it here.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('my-life-apk/src/com/osulsa/mylife/ReminderScheduler.java')
          s = p.read_text()
          s = s.replace('private static List<JSONObject> specsForResponsibility(JSONObject r, boolean completedToday) {',
                        'private static List<JSONObject> specsForResponsibility(JSONObject r, boolean completedToday) throws org.json.JSONException {')
          s = s.replace('private static List<JSONObject> specsForRoutine(String key, JSONObject routine) {',
                        'private static List<JSONObject> specsForRoutine(String key, JSONObject routine) throws org.json.JSONException {')
          s = s.replace('LocalDate anchor, int hour, int minute, int interval, int offsetDays) {',
                        'LocalDate anchor, int hour, int minute, int interval, int offsetDays) throws org.json.JSONException {')
          p.write_text(s)
          PY

          "$BT/aapt2" compile --dir my-life-apk/res -o build/resources.zip
          unzip -q build/resources.zip -d build/compiled-res
          mapfile -d '' RES_FILES < <(find build/compiled-res -type f -name '*.flat' -print0)
          RES_ARGS=()
          for f in "${RES_FILES[@]}"; do RES_ARGS+=( -R "$f" ); done
          "$BT/aapt2" link \
            --auto-add-overlay \
            -I "$ANDROID_JAR" \
            --manifest my-life-apk/AndroidManifest.xml \
            --min-sdk-version 26 \
            --target-sdk-version 36 \
            --java build/gen \
            "${RES_ARGS[@]}" \
            -A my-life-apk/assets \
            -o build/My-Life-unsigned.apk

          find my-life-apk/src build/gen -name '*.java' -print0 | \
            xargs -0 javac -source 8 -target 8 -classpath "$ANDROID_JAR" -d build/classes
          jar cf build/classes.jar -C build/classes .
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --output build/dex build/classes.jar
          zip -j build/My-Life-unsigned.apk build/dex/classes.dex
          "$BT/zipalign" -f -p 4 build/My-Life-unsigned.apk build/My-Life-aligned.apk

          keytool -genkeypair -noprompt \
            -keystore build/test-key.jks -storepass android -keypass android \
            -alias mylife-test -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=My Life Test,O=OSULSA,C=US"
          "$BT/apksigner" sign \
            --ks build/test-key.jks --ks-pass pass:android --key-pass pass:android \
            --out build/My-Life.apk build/My-Life-aligned.apk

          test -s build/My-Life.apk
          unzip -tqq build/My-Life.apk
          unzip -l build/My-Life.apk | grep -q 'assets/index.html'
          unzip -l build/My-Life.apk | grep -q 'classes.dex'
          "$BT/apksigner" verify --verbose --print-certs build/My-Life.apk
          "$BT/aapt2" dump badging build/My-Life.apk | head -20
          cp build/My-Life.apk output-v3/My-Life.apk
          sha256sum output-v3/My-Life.apk | tee output-v3/My-Life.apk.sha256

      - name: Record result without failure-email loop
        if: always()
        shell: bash
        run: |
          if [ -s output-v3/My-Life.apk ]; then
            {
              echo 'status=SUCCESS'
              echo 'artifact=output-v3/My-Life.apk'
              cat output-v3/My-Life.apk.sha256
            } > output-v3/BUILD_RESULT.txt
          else
            {
              echo 'status=FAILED'
              echo 'No automatic retry was performed.'
              echo
              echo 'Last log lines:'
              tail -140 output-v3/build.log 2>/dev/null || true
            } > output-v3/BUILD_RESULT.txt
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add output-v3
          git commit -m 'Record My Life V3 build result' || true
          git push origin HEAD:my-life-final-one-shot
